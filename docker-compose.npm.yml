version: '3.8'

services:
  blog:
    build: .
    container_name: blog
    restart: unless-stopped
    # No need to expose ports publicly - NPM will access internally
    expose:
      - "3001"
    volumes:
      - blog-data:/app/prisma
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/class/thermal:/sys/class/thermal:ro
    environment:
      - DATABASE_URL=file:/app/prisma/blog.db
      - JWT_SECRET=${JWT_SECRET:-development}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
    networks:
      - proxy-net  # Connect to NPM network
      - default    # Also keep default network for internal services

networks:
  proxy-net:
    external: true  # Use existing NPM network
  default:
    driver: bridge

volumes:
  blog-data:
